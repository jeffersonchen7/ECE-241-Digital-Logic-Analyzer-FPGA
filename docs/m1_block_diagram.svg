<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <style>
      .w   { stroke:#222; stroke-width:1.6; fill:none; }
      .bus { stroke:#222; stroke-width:3; fill:none; }
      .blk { fill:#e8f0fb; stroke:#1f3f73; stroke-width:1.8; }
      .aux { fill:#f1f1f1; stroke:#444; stroke-width:1.8; }
      .mux { fill:#fff6d6; stroke:#7a5c00; stroke-width:1.6; }
      .t   { font-size:15px; font-weight:bold; fill:#111; }
      .d   { font-size:11.5px; fill:#333; }
      .s   { font-size:11px; fill:#1a4f9c; paint-order:stroke; stroke:#ffffff; stroke-width:4px; stroke-linejoin:round; }
      .pin { font-size:13px; font-weight:bold; fill:#111; }
      .sm  { font-size:10px; fill:#555; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="750" y="34" text-anchor="middle" font-size="20" font-weight="bold">Milestone 1 — 8-Channel Logic Analyzer Acquisition Core (logic_analyzer.v)</text>

  <!-- ===== top wrapper ===== -->
  <rect x="150" y="60" width="1180" height="770" fill="none" stroke="#111" stroke-width="2.4" rx="6"/>
  <text x="162" y="80" font-size="14" font-weight="bold">top  (DE1-SoC board wrapper)</text>

  <!-- ===== logic_analyzer_core ===== -->
  <rect x="500" y="110" width="680" height="660" fill="#fafcff" stroke="#1f3f73" stroke-width="2" stroke-dasharray="9 5" rx="6"/>
  <text x="514" y="132" font-size="14" font-weight="bold" fill="#1f3f73">logic_analyzer_core  (board-independent, reusable)</text>

  <!-- ===== Blocks ===== -->
  <!-- test_gen -->
  <rect class="aux" x="180" y="110" width="165" height="95" rx="4"/>
  <text class="t" x="262" y="130" text-anchor="middle">test_gen</text>
  <text class="d" x="262" y="148" text-anchor="middle">ch0 10 MHz · ch1 5 MHz</text>
  <text class="d" x="262" y="163" text-anchor="middle">ch[5:2] 4-bit counter</text>
  <text class="d" x="262" y="178" text-anchor="middle">ch6 1-clk pulse</text>
  <text class="d" x="262" y="193" text-anchor="middle">ch7 ≈781 kHz</text>

  <!-- live_timer -->
  <rect class="aux" x="180" y="570" width="160" height="85" rx="4"/>
  <text class="t" x="260" y="590" text-anchor="middle">live_timer</text>
  <text class="d" x="260" y="608" text-anchor="middle">20-bit counter</text>
  <text class="d" x="260" y="623" text-anchor="middle">833,333 clk ≈ 60 Hz</text>
  <text class="d" x="260" y="638" text-anchor="middle">fires at once on SW[7]↑</text>

  <!-- sync_2ff -->
  <rect class="blk" x="540" y="160" width="170" height="90" rx="4"/>
  <text class="t" x="625" y="182" text-anchor="middle">sync_2ff</text>
  <text class="d" x="625" y="201" text-anchor="middle">2-stage D-FF synchronizer</text>
  <text class="d" x="625" y="217" text-anchor="middle">stage1 → sync_out</text>
  <text class="d" x="625" y="233" text-anchor="middle">(metastability guard)</text>

  <!-- rate_divider -->
  <rect class="blk" x="540" y="335" width="170" height="90" rx="4"/>
  <text class="t" x="625" y="357" text-anchor="middle">rate_divider</text>
  <text class="d" x="625" y="376" text-anchor="middle">Lab 4 enable counter</text>
  <text class="d" x="625" y="392" text-anchor="middle">1-clk sample_en pulse</text>
  <text class="d" x="625" y="408" text-anchor="middle">50 MSPS … 10 kSPS</text>

  <!-- trigger_unit -->
  <rect class="blk" x="780" y="290" width="180" height="140" rx="4"/>
  <text class="t" x="870" y="312" text-anchor="middle">trigger_unit</text>
  <text class="d" x="870" y="331" text-anchor="middle">prev_sample register</text>
  <text class="d" x="870" y="349" text-anchor="middle">trig_mode:</text>
  <text class="d" x="870" y="365" text-anchor="middle">00 rising · 01 falling</text>
  <text class="d" x="870" y="381" text-anchor="middle">10 either edge</text>
  <text class="d" x="870" y="397" text-anchor="middle">11 masked pattern</text>
  <text class="sm" x="870" y="417" text-anchor="middle">(sample&amp;mask)==(val&amp;mask)</text>

  <!-- capture_fsm -->
  <rect class="blk" x="780" y="520" width="180" height="170" rx="4"/>
  <text class="t" x="870" y="542" text-anchor="middle">capture_fsm</text>
  <text class="d" x="870" y="560" text-anchor="middle">y_Q / Y_D 4-state FSM</text>
  <text class="d" x="870" y="578" text-anchor="middle">IDLE → WAIT_TRIG</text>
  <text class="d" x="870" y="594" text-anchor="middle">→ CAPTURE → DONE</text>
  <text class="d" x="870" y="612" text-anchor="middle">arm_pulse = arm &amp; ~arm_prev</text>
  <text class="d" x="870" y="630" text-anchor="middle">13-bit wr_addr counter</text>
  <text class="d" x="870" y="646" text-anchor="middle">(0 … 8191, post-trigger)</text>
  <text class="d" x="870" y="664" text-anchor="middle">DONE: re-arm → WAIT_TRIG</text>

  <!-- ram_8kx8 -->
  <rect class="blk" x="1010" y="160" width="140" height="200" rx="4"/>
  <text class="t" x="1080" y="184" text-anchor="middle">ram_8kx8</text>
  <text class="d" x="1080" y="232" text-anchor="middle">8192 × 8-bit</text>
  <text class="d" x="1080" y="248" text-anchor="middle">simple dual-port</text>
  <text class="d" x="1080" y="264" text-anchor="middle">synchronous RAM</text>
  <text class="d" x="1080" y="280" text-anchor="middle">1-clk read latency</text>
  <text class="sm" x="1016" y="209">wr_data</text>
  <text class="sm" x="1144" y="304" text-anchor="end">rd_data</text>
  <text class="sm" x="1030" y="350" text-anchor="middle">wr_en</text>
  <text class="sm" x="1072" y="338" text-anchor="middle">wr_addr</text>
  <text class="sm" x="1122" y="350" text-anchor="middle">rd_addr</text>

  <!-- ===== Muxes ===== -->
  <!-- probe source mux (center y=205) -->
  <polygon class="mux" points="420,165 450,180 450,230 420,245"/>
  <text class="d" x="428" y="190">1</text>
  <text class="d" x="428" y="230">0</text>
  <line class="w" x1="435" y1="238" x2="435" y2="265"/>
  <text class="pin" x="435" y="280" text-anchor="middle">SW[9]</text>
  <text class="sm" x="435" y="158" text-anchor="middle">probe src</text>

  <!-- rate mux (center y=380) -->
  <polygon class="mux" points="420,340 450,355 450,405 420,420"/>
  <text class="d" x="428" y="365">1</text>
  <text class="d" x="428" y="405">0</text>
  <line class="w" x1="435" y1="413" x2="435" y2="440"/>
  <text class="pin" x="435" y="455" text-anchor="middle">SW[8]</text>
  <text class="sm" x="435" y="333" text-anchor="middle">rate</text>

  <!-- arm mux (center y=620) -->
  <polygon class="mux" points="420,580 450,595 450,645 420,660"/>
  <text class="d" x="428" y="605">1</text>
  <text class="d" x="428" y="645">0</text>
  <line class="w" x1="435" y1="653" x2="435" y2="690"/>
  <text class="pin" x="435" y="705" text-anchor="middle">SW[7]</text>
  <text class="sm" x="435" y="573" text-anchor="middle">arm src</text>

  <!-- ===== Wires ===== -->
  <!-- test_gen -> probe mux (1) -->
  <path class="bus" d="M345,185 H420" marker-end="url(#arr)"/>
  <text class="s" x="350" y="200">test_out[7:0]</text>
  <!-- test_gen -> GPIO_1 -->
  <circle cx="385" cy="185" r="4" fill="#222"/>
  <path class="bus" d="M385,185 V88 H1330" marker-end="url(#arr)"/>
  <text class="s" x="860" y="82" text-anchor="middle">test_out[7:0] (driven out for external loopback / scope)</text>

  <!-- GPIO_0 -> probe mux (0) -->
  <path class="bus" d="M150,225 H420" marker-end="url(#arr)"/>

  <!-- probe mux -> sync_2ff -->
  <path class="bus" d="M450,205 H540" marker-end="url(#arr)"/>
  <text class="s" x="495" y="198" text-anchor="middle">probes_in[7:0]</text>

  <!-- sync_2ff -> RAM wr_data, branch to trigger -->
  <path class="bus" d="M710,205 H1010" marker-end="url(#arr)"/>
  <text class="s" x="885" y="198" text-anchor="middle">synced_sample[7:0]</text>
  <circle cx="755" cy="205" r="4.5" fill="#222"/>
  <path class="bus" d="M755,205 V320 H780" marker-end="url(#arr)"/>

  <!-- trigger constants -->
  <path class="w" d="M900,262 V290" marker-end="url(#arr)"/>
  <text class="sm" x="900" y="246" text-anchor="middle">trig_mode=2'b00, trig_ch=0</text>
  <text class="sm" x="900" y="258" text-anchor="middle">(hardcoded in top for M1)</text>

  <!-- rate constants -> rate mux -->
  <path class="w" d="M330,360 H420" marker-end="url(#arr)"/>
  <text class="d" x="325" y="364" text-anchor="end">3'd2 (10 MSPS)</text>
  <path class="w" d="M330,400 H420" marker-end="url(#arr)"/>
  <text class="d" x="325" y="404" text-anchor="end">3'd0 (50 MSPS)</text>

  <!-- rate mux -> rate_divider -->
  <path class="bus" d="M450,380 H540" marker-end="url(#arr)"/>
  <text class="s" x="495" y="373" text-anchor="middle">rate_sel[2:0]</text>

  <!-- sample_en -> trigger + fsm -->
  <path class="w" d="M710,380 H780" marker-end="url(#arr)"/>
  <text class="s" x="745" y="373" text-anchor="middle">sample_en</text>
  <circle cx="738" cy="380" r="4" fill="#222"/>
  <path class="w" d="M738,380 V560 H780" marker-end="url(#arr)"/>
  <text class="s" x="744" y="554">sample_en</text>

  <!-- trig_fire -> fsm -->
  <path class="w" d="M870,430 V520" marker-end="url(#arr)"/>
  <text class="s" x="877" y="480">trig_fire</text>

  <!-- live_timer -> arm mux (1) -->
  <path class="w" d="M340,600 H420" marker-end="url(#arr)"/>
  <text class="s" x="380" y="593" text-anchor="middle" font-size="10">refresh_pulse</text>

  <!-- SW[7] -> live_timer enable -->
  <path class="w" d="M150,620 H180" marker-end="url(#arr)"/>
  <!-- KEY[1] (inverted) -> arm mux (0) -->
  <path class="w" d="M150,680 H400 V640 H420" marker-end="url(#arr)"/>
  <circle cx="165" cy="680" r="5" fill="#fff" stroke="#222" stroke-width="1.6"/>
  <text class="s" x="240" y="674" text-anchor="middle">~KEY[1] (snapshot button)</text>

  <!-- arm mux -> fsm arm -->
  <path class="w" d="M450,620 H780" marker-end="url(#arr)"/>
  <text class="s" x="640" y="613" text-anchor="middle">arm</text>

  <!-- fsm -> RAM wr_en / wr_addr -->
  <path class="w" d="M960,565 H1030 V360" marker-end="url(#arr)"/>
  <text class="s" x="966" y="559">wr_en</text>
  <path class="bus" d="M960,590 H1072 V360" marker-end="url(#arr)"/>
  <text class="s" x="966" y="584" font-size="10">wr_addr[12:0]</text>

  <!-- SW[6:0] -> rd_addr -->
  <path class="bus" d="M150,740 H1122 V360" marker-end="url(#arr)"/>
  <text class="s" x="640" y="733" text-anchor="middle">rd_addr[12:0] = {6'b0, SW[6:0]}   (selects RAM slot 0…127)</text>

  <!-- RAM rd_data -> LEDR[7:0] -->
  <path class="bus" d="M1150,300 H1330" marker-end="url(#arr)"/>
  <text class="s" x="1240" y="293" text-anchor="middle">rd_data[7:0]</text>

  <!-- busy / done -> LEDR (hop over rd_addr at x=1122) -->
  <path class="w" d="M960,635 H1115 a7,7 0 0 1 14,0 H1330" marker-end="url(#arr)"/>
  <text class="s" x="1240" y="628" text-anchor="middle">busy</text>
  <path class="w" d="M960,665 H1115 a7,7 0 0 1 14,0 H1330" marker-end="url(#arr)"/>
  <text class="s" x="1240" y="658" text-anchor="middle">done</text>
  <text class="sm" x="966" y="629">busy = WAIT_TRIG|CAPTURE</text>
  <text class="sm" x="966" y="659">done = DONE</text>

  <!-- clock / reset -->
  <path class="w" d="M150,785 H210"/>
  <text class="s" x="216" y="789">→ clk of every register (50 MHz)</text>
  <path class="w" d="M150,810 H210"/>
  <text class="s" x="216" y="814">→ reset_n of every block (synchronous, active-low)</text>

  <!-- ===== Board pins (left) ===== -->
  <g class="pin">
    <rect x="144" y="219" width="12" height="12" fill="#333"/>
    <text x="136" y="230" text-anchor="end">GPIO_0[7:0]</text>
    <text class="sm" x="136" y="244" text-anchor="end">physical probes</text>

    <rect x="144" y="614" width="12" height="12" fill="#333"/>
    <text x="136" y="625" text-anchor="end">SW[7]</text>
    <text class="sm" x="136" y="639" text-anchor="end">1 = live mode</text>

    <rect x="144" y="674" width="12" height="12" fill="#333"/>
    <text x="136" y="685" text-anchor="end">KEY[1]</text>

    <rect x="144" y="734" width="12" height="12" fill="#333"/>
    <text x="136" y="745" text-anchor="end">SW[6:0]</text>

    <rect x="144" y="779" width="12" height="12" fill="#333"/>
    <text x="136" y="790" text-anchor="end">CLOCK_50</text>

    <rect x="144" y="804" width="12" height="12" fill="#333"/>
    <text x="136" y="815" text-anchor="end">KEY[0]</text>
  </g>

  <!-- ===== Board pins (right) ===== -->
  <g class="pin">
    <rect x="1324" y="82" width="12" height="12" fill="#333"/>
    <text x="1344" y="93">GPIO_1[7:0]</text>

    <rect x="1324" y="294" width="12" height="12" fill="#333"/>
    <text x="1344" y="305">LEDR[7:0]</text>
    <text class="sm" x="1344" y="319">captured byte</text>

    <rect x="1324" y="629" width="12" height="12" fill="#333"/>
    <text x="1344" y="640">LEDR[8]</text>
    <rect x="1324" y="659" width="12" height="12" fill="#333"/>
    <text x="1344" y="670">LEDR[9]</text>
  </g>

  <!-- ===== Legend ===== -->
  <g transform="translate(150,850)">
    <rect x="0" y="0" width="28" height="16" class="blk"/>
    <text class="d" x="36" y="12">core submodule</text>
    <rect x="150" y="0" width="28" height="16" class="aux"/>
    <text class="d" x="186" y="12">top-level helper</text>
    <polygon class="mux" points="310,0 326,6 326,10 310,16"/>
    <text class="d" x="334" y="12">2:1 mux (always @(*) if/else)</text>
    <line class="bus" x1="530" y1="8" x2="570" y2="8"/>
    <text class="d" x="578" y="12">multi-bit bus</text>
    <line class="w" x1="680" y1="8" x2="720" y2="8"/>
    <text class="d" x="728" y="12">single bit</text>
    <rect x="820" y="2" width="12" height="12" fill="#333"/>
    <text class="d" x="840" y="12">DE1-SoC pin</text>
    <rect x="950" y="0" width="28" height="16" fill="none" stroke="#1f3f73" stroke-width="2" stroke-dasharray="5 3"/>
    <text class="d" x="986" y="12">logic_analyzer_core boundary</text>
  </g>
</svg>
