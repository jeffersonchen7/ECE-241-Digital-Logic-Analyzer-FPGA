<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 396" width="1270" height="396" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#6b6b6b"/>
    </marker>
    <style>
      .ln  { stroke:#6b6b6b; stroke-width:1.3; fill:none; }
      .io  { fill:#e6e6e6; }
      .core{ fill:#cfe5c3; }
      .top { fill:#dbe7f5; }
      .ti  { font-size:13px; font-weight:bold; fill:#333; text-anchor:middle; }
      .su  { font-size:10.5px; fill:#6b6b6b; text-anchor:middle; }
      .lb  { font-size:10px; fill:#6b6b6b; }
      .lg  { font-size:11px; fill:#6b6b6b; }
    </style>
  </defs>

  <rect width="1270" height="396" fill="#ffffff"/>

  <!-- FPGA region -->
  <rect x="185" y="26" width="900" height="345" fill="#eaf3e4"/>

  <!-- ===== wires (drawn first so blocks sit on top) ===== -->
  <!-- switches & keys control bus -->
  <path class="ln" d="M170,118 H178 V72 H815"/>
  <path class="ln" d="M275,72 V190" marker-end="url(#a)"/>
  <path class="ln" d="M455,72 V90" marker-end="url(#a)"/>
  <path class="ln" d="M635,72 V90" marker-end="url(#a)"/>
  <path class="ln" d="M815,72 V90" marker-end="url(#a)"/>
  <text class="lb" x="281" y="66">SW[9]</text>
  <text class="lb" x="461" y="66">SW[8]</text>
  <text class="lb" x="641" y="66">SW[7]</text>
  <text class="lb" x="821" y="66">SW[7], KEY[1]</text>

  <!-- main data path -->
  <path class="ln" d="M170,218 H200" marker-end="url(#a)"/>
  <path class="ln" d="M350,218 H380" marker-end="url(#a)"/>
  <path class="ln" d="M530,218 H560" marker-end="url(#a)"/>
  <path class="ln" d="M710,218 H740" marker-end="url(#a)"/>
  <path class="ln" d="M890,218 H920" marker-end="url(#a)"/>
  <path class="ln" d="M1070,218 H1100" marker-end="url(#a)"/>

  <!-- test generator -->
  <path class="ln" d="M275,290 V246" marker-end="url(#a)"/>
  <path class="ln" d="M200,318 H170" marker-end="url(#a)"/>

  <!-- sample_en from rate divider -->
  <path class="ln" d="M455,146 V168 H775 V190" marker-end="url(#a)"/>
  <path class="ln" d="M635,168 V190" marker-end="url(#a)"/>
  <text class="lb" x="463" y="162">sample_en</text>

  <!-- live timer -> arm select -> FSM -->
  <path class="ln" d="M710,118 H740" marker-end="url(#a)"/>
  <path class="ln" d="M850,146 V190" marker-end="url(#a)"/>
  <text class="lb" x="836" y="180" text-anchor="end">arm</text>

  <!-- FSM status -> LEDR[9:8] -->
  <path class="ln" d="M875,190 V160 H1175 V146" marker-end="url(#a)"/>
  <text class="lb" x="935" y="155">busy, done</text>

  <!-- synchronized samples -> RAM write data -->
  <path class="ln" d="M455,246 V268 H960 V246" marker-end="url(#a)"/>
  <text class="lb" x="707" y="283" text-anchor="middle">synchronized samples [7:0]</text>

  <!-- read address -->
  <path class="ln" d="M1100,318 H1035 V246" marker-end="url(#a)"/>

  <!-- ===== blocks ===== -->
  <!-- DE1-SoC I/O, left -->
  <rect class="io" x="20" y="90" width="150" height="56"/>
  <text class="ti" x="95" y="114">Switches &amp; keys</text>
  <text class="su" x="95" y="131">SW[9:7], KEY[1]</text>

  <rect class="io" x="20" y="190" width="150" height="56"/>
  <text class="ti" x="95" y="214">GPIO_0 header</text>
  <text class="su" x="95" y="231">8 probe inputs</text>

  <rect class="io" x="20" y="290" width="150" height="56"/>
  <text class="ti" x="95" y="314">GPIO_1 header</text>
  <text class="su" x="95" y="331">test pattern out</text>

  <!-- top-level wrapper logic -->
  <rect class="top" x="200" y="190" width="150" height="56"/>
  <text class="ti" x="275" y="214">Input select</text>
  <text class="su" x="275" y="231">GPIO_0 or test pattern</text>

  <rect class="top" x="200" y="290" width="150" height="56"/>
  <text class="ti" x="275" y="314">Test generator</text>
  <text class="su" x="275" y="331">10 MHz, 5 MHz, counter</text>

  <rect class="top" x="560" y="90" width="150" height="56"/>
  <text class="ti" x="635" y="114">Live timer</text>
  <text class="su" x="635" y="131">~60 Hz auto re-arm</text>

  <rect class="top" x="740" y="90" width="150" height="56"/>
  <text class="ti" x="815" y="114">Arm select</text>
  <text class="su" x="815" y="131">live timer or KEY[1]</text>

  <!-- logic_analyzer_core -->
  <rect class="core" x="380" y="90" width="150" height="56"/>
  <text class="ti" x="455" y="114">Rate divider</text>
  <text class="su" x="455" y="131">50 or 10 MSPS</text>

  <rect class="core" x="380" y="190" width="150" height="56"/>
  <text class="ti" x="455" y="214">Synchronizer</text>
  <text class="su" x="455" y="231">2-FF, all 8 channels</text>

  <rect class="core" x="560" y="190" width="150" height="56"/>
  <text class="ti" x="635" y="214">Trigger unit</text>
  <text class="su" x="635" y="231">rising edge on ch0</text>

  <rect class="core" x="740" y="190" width="150" height="56"/>
  <text class="ti" x="815" y="214">Capture FSM</text>
  <text class="su" x="815" y="231">idle, wait, capture, done</text>

  <rect class="core" x="920" y="190" width="150" height="56"/>
  <text class="ti" x="995" y="214">Sample RAM</text>
  <text class="su" x="995" y="231">8K × 8, dual-port</text>

  <!-- DE1-SoC I/O, right -->
  <rect class="io" x="1100" y="90" width="150" height="56"/>
  <text class="ti" x="1175" y="114">LEDR[9:8]</text>
  <text class="su" x="1175" y="131">busy, done</text>

  <rect class="io" x="1100" y="190" width="150" height="56"/>
  <text class="ti" x="1175" y="214">LEDR[7:0]</text>
  <text class="su" x="1175" y="231">captured byte</text>

  <rect class="io" x="1100" y="290" width="150" height="56"/>
  <text class="ti" x="1175" y="314">SW[6:0]</text>
  <text class="su" x="1175" y="331">RAM read address</text>

</svg>
